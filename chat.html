<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Test chat</title>
<style>
:root{--paper:#eceee7;--card:#f8f9f4;--ink:#1d2733;--rule:#c8cec1;--dim:#68736b;--teal:#0f6b66;--red:#b3261e;--amber:#92620a}
*{box-sizing:border-box}html,body{height:100%;margin:0}
body{display:flex;flex-direction:column;background:var(--paper);color:var(--ink);font:15px/1.4 system-ui,sans-serif}
header{padding:10px 14px;border-bottom:2px solid var(--ink);background:var(--card)}
h1{font:700 19px Georgia,serif;margin:0}
.dim{color:var(--dim)}.ok{color:var(--teal)}.bad{color:var(--red)}
.meter{display:flex;gap:18px;padding:8px 14px;border-bottom:1px solid var(--rule);background:var(--card);font-variant-numeric:tabular-nums;flex-wrap:wrap}
.meter b{display:block;font:700 17px Georgia,serif}
#warn{padding:6px 14px;background:#f3e3c2;color:#5c3d05;display:none}
#ml{flex:1;overflow:auto;padding:12px 14px;display:flex;flex-direction:column;gap:6px}
.m{max-width:80%;padding:6px 10px;border-radius:12px 12px 12px 2px;background:#fff;border:1px solid var(--rule);word-wrap:break-word}
.m.me{align-self:flex-end;background:var(--teal);color:#fff;border-color:var(--teal);border-radius:12px 12px 2px 12px}
.m small{display:block;opacity:.7;font-size:11px}
.sys{align-self:center;text-align:center;font-size:12px;color:var(--dim);padding:2px 8px}
.bar{display:flex;gap:6px;padding:8px 14px;border-top:1px solid var(--rule);background:var(--card);align-items:center;flex-wrap:wrap}
input,button,select{font:inherit;color:var(--ink);background:#fff;border:1px solid var(--ink);border-radius:2px;padding:5px 9px}
#in{flex:1;min-width:0}button{cursor:pointer}button.go{background:var(--teal);border-color:var(--teal);color:#fff}
button:disabled,input:disabled{opacity:.5;cursor:not-allowed}
:focus-visible{outline:3px solid var(--amber);outline-offset:1px}
#st{padding:4px 14px;font-size:12px;min-height:22px}
</style></head><body>
<header><h1 id="ttl">Test chat</h1><div class="dim" id="sub"></div>
<div style="margin-top:4px">Speaking as <select id="who" aria-label="Speaking as"></select></div></header>
<div class="meter"><div><span class="dim" id="wl">Wallet</span><b id="bal">-</b></div><div><span class="dim">Billed</span><b id="bil">-</b></div><div><span class="dim">Next minute in</span><b id="nxt">-</b></div></div>
<div id="warn"></div><div id="ml" role="log" aria-live="polite"></div><div id="st" class="dim"></div>
<form class="bar" id="f"><input id="in" autocomplete="off" aria-label="Message"><button class="go" id="snd">Send</button></form>
<div class="bar"><button id="bill">Bill now</button><button id="skip">Skip 1 min</button><button id="end">End session</button><label><input type="checkbox" id="auto" checked> Auto-bill every 5 s</label><button id="clr">Clear chat</button></div>
<script>
const $=s=>document.querySelector(s),q=new URLSearchParams(location.search);
const API_BASE='http://127.0.0.1:8000';
const apiUrl=path=>`${API_BASE}${path.startsWith('/')?path:'/'+path}`;
let acc=JSON.parse(localStorage.acc||'{}'),me=q.get('as')||localStorage.me||'',sid=+q.get('session')||null,S=null,off=0,sig='';
const key=()=>'chat:'+sid,msgs=()=>JSON.parse(localStorage.getItem(key())||'[]');
const esc=v=>String(v??'').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const hm=t=>new Date(t).toTimeString().slice(0,5),mmss=x=>Math.floor(x/60)+':'+String(Math.floor(x%60)).padStart(2,'0');
async function load(){try{const r=await fetch(apiUrl('/play/api/state/'));if(!r.ok)throw new Error(`HTTP ${r.status}`);S=await r.json();off=new Date(S.now)-Date.now();if(!sid&&S.sessions.length)sid=S.sessions[S.sessions.length-1].id;draw()}catch(err){$('#st').className='bad';$('#st').textContent=`Cannot load ${apiUrl('/play/api/state/')}: ${err.message}. Check Django and CORS.`}}
function draw(){
 if(!S)return;const s=S.sessions.find(x=>x.id==sid);
 const names=Object.keys(acc).filter(n=>S.users.some(u=>u.username==n)),h=names.map(n=>`<option ${n==me?'selected':''}>${esc(n)}</option>`).join('');
 if($('#who').dataset.h!==h){$('#who').innerHTML=h;$('#who').dataset.h=h}
 if(!s){$('#ttl').textContent='No session yet';$('#sub').textContent='Create and start one in the playground.';return}
 const part=me==s.user||me==s.provider,other=me==s.user?s.provider:s.user;
 $('#ttl').textContent=part?'Chat with '+(other||'a provider'):'Session #'+sid+' (you are not in it)';
 $('#sub').textContent='Session #'+sid+' · '+s.status.replace(/_/g,' ');
 const w=S.wallets.find(w=>w.user==s.user),rate=s.per_minute_cost||(S.users.find(u=>u.username==s.provider)||{}).rate;
 $('#wl').textContent='Wallet · '+s.user;$('#bal').textContent='₹'+(w?w.balance:'0.00');$('#bil').textContent=s.billed_minutes+' min · ₹'+s.billed_amount;
 const live=s.status=='in_progress';let nxt='-',warn='';
 if(live){const el=(Date.now()+off-new Date(s.started_at))/1000,owed=Math.max(1,Math.ceil(el/60));nxt=mmss(Math.max(0,owed*60-el));if(owed>s.billed_minutes)warn='A minute is owed but not billed yet. Waiting for a billing tick.';if(w&&rate&&Number(w.balance)<Number(rate))warn='The wallet cannot pay the next minute. The session ends at the next tick.'}
 $('#nxt').textContent=nxt;$('#warn').style.display=warn?'block':'none';$('#warn').textContent=warn;
 const can=live&&part;$('#in').disabled=!can;$('#snd').disabled=!can;$('#in').placeholder=can?'Type a message':live?'You are not in this session':'Chat opens when the session is in progress';
 const sg=msgs().length+'|'+s.status+'|'+sid+'|'+me;
 if(sg!=sig){sig=sg;const ml=$('#ml'),nb=ml.scrollHeight-ml.scrollTop-ml.clientHeight<60;let o='';
  if(s.started_at)o+=`<div class="sys">Session started at ${esc(s.started_at.slice(11,19))} UTC · ₹${esc(s.per_minute_cost)}/min</div>`;
  o+=msgs().map(m=>`<div class="m ${m.from==me?'me':''}"><small>${esc(m.from)} · ${hm(m.t)}</small>${esc(m.text)}</div>`).join('');
  if(s.status=='completed')o+=`<div class="sys">Session ended by ${esc(s.ended_by)}${s.end_reason?': '+esc(s.end_reason.replace('_',' ')):''}. ${s.billed_minutes} min billed, ₹${esc(s.billed_amount)}.</div>`;
  if(s.status=='cancelled')o+='<div class="sys">Session cancelled.</div>';ml.innerHTML=o||'<div class="sys">Nothing yet. Start the session to open the chat.</div>';if(nb)ml.scrollTop=ml.scrollHeight}
}
async function post(p,b){const h={'Content-Type':'application/json'};if(acc[me])h.Authorization='Token '+acc[me].token;try{const r=await fetch(apiUrl(p),{method:'POST',headers:h,body:JSON.stringify(b||{})}),j=await r.json().catch(()=>({}));$('#st').className=r.ok?'ok':'bad';$('#st').textContent=r.ok?'OK '+apiUrl(p):`${r.status} ${j.code||''} ${j.error||j.detail||''}`;await load()}catch(err){$('#st').className='bad';$('#st').textContent=`Request failed: ${apiUrl(p)} (${err.message}). Check Django and CORS.`}}
$('#bill').onclick=()=>post(`/api/sessions/${sid}/bill/`);
$('#end').onclick=()=>post(`/api/sessions/${sid}/end/`);
$('#skip').onclick=()=>post('/play/api/time-travel/',{session_id:sid,minutes:1});
$('#clr').onclick=()=>{localStorage.removeItem(key());sig='';draw()};
$('#who').onchange=e=>{me=e.target.value;sig='';draw()};
$('#f').onsubmit=e=>{e.preventDefault();const t=$('#in').value.trim();if(!t||$('#in').disabled)return;const m=msgs();m.push({from:me,text:t,t:Date.now()});localStorage.setItem(key(),JSON.stringify(m));$('#in').value='';sig='';draw()};
addEventListener('storage',e=>{if(e.key==key()||e.key=='acc'){acc=JSON.parse(localStorage.acc||'{}');sig='';draw()}});
setInterval(()=>{const s=S&&S.sessions.find(x=>x.id==sid);if($('#auto').checked&&s&&s.status=='in_progress')fetch(apiUrl('/play/api/bill-all/'),{method:'POST'}).then(load).catch(()=>{})},5000);
setInterval(load,2000);setInterval(draw,1000);load();
</script></body></html>
